[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "gunicorn main:app --worker-class uvicorn.workers.UvicornWorker --workers 1 --max-requests 100 --max-requests-jitter 20 --bind 0.0.0.0:8000 --timeout 300 --keep-alive 5"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
